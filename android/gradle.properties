# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is mandatory for this project (Compose, DataStore, security-crypto).
android.useAndroidX=true
# Generate R classes per-module only; faster builds, smaller R classes.
android.nonTransitiveRClass=true
# Official Kotlin code style so IDE formatting matches the sources.
kotlin.code.style=official
